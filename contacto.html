<!-- CONTACT FORM (Formspree) -->
<section class="contact-form-section" id="contact-form">
  <div class="contact-form-inner">
    <div class="contact-form-head">
      <span class="eyebrow" data-es="Formulario" data-en="Form">Formulario</span>
      <h2 class="section-heading">
        <span data-es="Cuéntame tu" data-en="Tell me your">Cuéntame tu</span>
        <span class="italic" data-es="proyecto." data-en="project.">proyecto.</span>
      </h2>
    </div>

    <form class="contact-form" id="contactForm" action="https://formspree.io/f/REPLACE_WITH_YOUR_FORM_ID" method="POST" novalidate>
      <div class="form-row">
        <label class="form-field">
          <span class="form-label" data-es="Nombre" data-en="Name">Nombre</span>
          <input type="text" name="name" required autocomplete="name">
        </label>
        <label class="form-field">
          <span class="form-label" data-es="Email" data-en="Email">Email</span>
          <input type="email" name="email" required autocomplete="email">
        </label>
      </div>
      <label class="form-field">
        <span class="form-label" data-es="Servicio" data-en="Service">Servicio</span>
        <select name="service">
          <option value="" data-es="Selecciona…" data-en="Select…">Selecciona…</option>
          <option value="fotografia" data-es="Fotografía" data-en="Photography">Fotografía</option>
          <option value="video" data-es="Video" data-en="Video">Video</option>
          <option value="direccion-arte" data-es="Dirección de arte" data-en="Art direction">Dirección de arte</option>
          <option value="contenido-creativo" data-es="Contenido creativo" data-en="Creative content">Contenido creativo</option>
          <option value="otro" data-es="Otro" data-en="Other">Otro</option>
        </select>
      </label>
      <label class="form-field">
        <span class="form-label" data-es="Mensaje" data-en="Message">Mensaje</span>
        <textarea name="message" rows="5" required></textarea>
      </label>
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="display:none">
      <button type="submit" class="cta-btn form-submit">
        <span data-es="Enviar →" data-en="Send →">Enviar →</span>
      </button>
      <p class="form-status" id="formStatus" aria-live="polite"></p>
    </form>
  </div>
</section>

<section class="service-cta">
  <h2 class="section-heading">

  <p data-es="Content that lasts." data-en="Content that lasts.">Content that lasts.</p>
